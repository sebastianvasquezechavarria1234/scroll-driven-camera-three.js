<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - animation - keyframes</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - animation - keyframes">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_animation_keyframes.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_animation_keyframes.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			body {
				margin: 0;
				background-color: #e2e0e0;
				color: #000;
				overflow-x: hidden;
			}

			a {
				color: #2983ff;
			}

			#container {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
			}

			#scroll-height {
				height: 500vh;
				pointer-events: none;
			}
		</style>
	</head>

	<body>

		<div id="container"></div>
		<div id="scroll-height"></div>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgl - animation - keyframes<br/>
			Model: <a href="https://artstation.com/artwork/1AGwX" target="_blank" rel="noopener">Littlest Tokyo</a> by
			<a href="https://artstation.com/glenatron" target="_blank" rel="noopener">Glen Fox</a>, CC Attribution.
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.170.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			import { Sky } from 'three/addons/objects/Sky.js';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

			let mixer;

			const clock = new THREE.Clock();
			const container = document.getElementById( 'container' );

			const stats = new Stats();
			container.appendChild( stats.dom );

			const renderer = new THREE.WebGLRenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			container.appendChild( renderer.domElement );

			const scene = new THREE.Scene();

			// Sky

			const sky = new Sky();
			sky.scale.setScalar( 10000 );
			scene.add( sky );

			const uniforms = sky.material.uniforms;
			uniforms[ 'turbidity' ].value = 2;
			uniforms[ 'rayleigh' ].value = 1;
			uniforms[ 'mieCoefficient' ].value = 0.005;
			uniforms[ 'mieDirectionalG' ].value = 0.8;
			uniforms[ 'sunPosition' ].value.set( 0, 1, 0 );

			const pmremGenerator = new THREE.PMREMGenerator( renderer );
			const environment = pmremGenerator.fromScene( sky ).texture;
			scene.environment = environment;

			const camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 100 );
			camera.position.set( 5, 2, 8 );

			// Camera path: start -> end positions
			const cameraPath = [
				{ pos: new THREE.Vector3( 5, 2, 8 ), target: new THREE.Vector3( 0, 0.7, 0 ) },
				{ pos: new THREE.Vector3( -3, 4, 5 ), target: new THREE.Vector3( 1, 1, 0 ) },
				{ pos: new THREE.Vector3( 0, 1, 2 ), target: new THREE.Vector3( 1, 0.5, 0 ) },
			];

			function getScrollProgress() {
				const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
				return maxScroll > 0 ? window.scrollY / maxScroll : 0;
			}

			function lerpVector3( a, b, t ) {
				return new THREE.Vector3(
					a.x + ( b.x - a.x ) * t,
					a.y + ( b.y - a.y ) * t,
					a.z + ( b.z - a.z ) * t
				);
			}

			function updateCameraFromScroll() {
				const t = getScrollProgress();
				const segments = cameraPath.length - 1;
				const segment = Math.min( Math.floor( t * segments ), segments - 1 );
				const localT = ( t * segments ) - segment;

				const from = cameraPath[ segment ];
				const to = cameraPath[ segment + 1 ];

				camera.position.copy( lerpVector3( from.pos, to.pos, localT ) );
				camera.lookAt( lerpVector3( from.target, to.target, localT ) );
			}

			const dracoLoader = new DRACOLoader();
			dracoLoader.setDecoderPath( 'https://unpkg.com/three@0.170.0/examples/jsm/libs/draco/' );

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( 'models/gltf/LittlestTokyo.glb', function ( gltf ) {

				const model = gltf.scene;
				model.position.set( 1, 1, 0 );
				model.scale.set( 0.01, 0.01, 0.01 );
				scene.add( model );

				mixer = new THREE.AnimationMixer( model );
				mixer.clipAction( gltf.animations[ 0 ] ).play();

				renderer.setAnimationLoop( animate );

			}, undefined, function ( e ) {

				console.error( e );

			} );

			window.onresize = function () {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			};

			function animate() {

				const delta = clock.getDelta();

				mixer.update( delta );

				updateCameraFromScroll();

				stats.update();

				renderer.render( scene, camera );

			}


		</script>

	</body>

</html>
